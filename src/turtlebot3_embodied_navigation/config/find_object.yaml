find_object_server:
  ros__parameters:
    allowed_classes: [ball]
    allowed_colors: [red, green, blue, yellow, unknown]
    allowed_rooms: [kitchen, living_room, bedroom, unknown]
    approach_distance: 0.8
    task_timeout: 300.0
    navigation_timeout: 90.0
    verification_timeout: 5.0
    maximum_candidates: 20
    # discrete_skill retains the baseline; continuous_local_goal makes VLA propose bounded local goals.
    policy_mode: disabled
    policy_interface: discrete_skill
    policy_endpoint: http://127.0.0.1:8089/select_action
    continuous_policy_endpoint: http://127.0.0.1:8089/predict_local_goal
    policy_timeout_milliseconds: 1000
    # Calibrate both values from the held-out VLA validation set before active mode.
    policy_max_prototype_distance: 1.0
    policy_min_prototype_gap: 0.1
    policy_image_max_age: 1.0
    detection_max_age: 1.0
    maximum_policy_decisions: 30
    maximum_planner_stages: 8
    maximum_local_goals_per_stage: 30
    camera_topic: /camera/color/image_raw
    map_frame: map
    robot_frame: base_link
    # x, y, yaw triples. Replace these coordinates after creating a new map.
    search_viewpoints: [
      1.083, 1.090, 0.72,
      0.855, 4.872, 3.14,
      -1.866, 4.661, 3.02,
      -4.151, 4.392, -1.60,
      -4.316, 0.217, -1.60,
      -4.228, -2.601, -2.90,
      -4.922, -1.308, 1.33,
      -3.236, 3.217, 0.00,
      -0.691, 2.877, -1.27,
      0.004, 0.989, 0.00
    ]
    viewpoint_rooms: [
      living_room, bedroom, bedroom, bedroom, kitchen,
      kitchen, kitchen, living_room, living_room, living_room
    ]
